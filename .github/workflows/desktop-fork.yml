name: Desktop fork

on:
  push:
    branches: [codex/remove-capacity-limits]
    tags: ["desktop-v*.*.*"]

permissions:
  contents: read

concurrency:
  group: desktop-fork
  cancel-in-progress: false
  queue: max

jobs:
  check:
    name: Check desktop branch
    if: github.repository == 'kareem717/OpenBot'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Validate desktop version
        id: version
        shell: bash
        run: |
          version=$(bun -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "desktop-v$version"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Check affected TypeScript projects
        run: |
          bun run typecheck:node
          bun run typecheck:renderer
      - name: Check real-service capacity and release feeds
        run: |
          bun scripts/unlimited-capacity-e2e.ts
          bun scripts/unlimited-memory-storage-e2e.ts
          bun scripts/agent-webhook-routine-e2e.ts
          bun scripts/plan-continuation-e2e.ts
          bun scripts/remote-server-retry-e2e.ts
          bun scripts/agent-api-keys-e2e.ts
          bun scripts/vault-credential-discovery-e2e.ts
          bun --conditions=browser scripts/webhook-card-reconnect-e2e.mjs
          bun scripts/codex-minimum-runtime-e2e.ts
          bun scripts/codex-mcp-session-recovery-e2e.ts
          bun scripts/codex-open-session-compaction-e2e.ts
          bun scripts/browser-takeover-steer-e2e.ts
          bun scripts/steer-history-e2e.ts
          bun scripts/desktop-feed-e2e.ts
          bash -n scripts/install-server.sh scripts/hosting/openbot-hosted-update
      - name: Install browser test display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb
      - name: Check browser credentials, CDP access, and user control
        run: |
          xvfb-run -a bun run test:browser-cdp
          xvfb-run -a bun scripts/browser-smoke.ts --scenario=secret-handoff
          xvfb-run -a bun scripts/browser-user-control-e2e.ts
      - name: Install and verify the pinned Codex runtime
        run: bun scripts/install-codex-runtime.ts linux x64
      - name: Check native MCP discovery and steering
        env:
          OPENBOT_CODEX_PATH: ${{ github.workspace }}/build/codex/linux/x64/bin/codex
        run: |
          bun scripts/codex-deferred-mcp-e2e.ts
          bun scripts/codex-held-tool-steer-e2e.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-fork-checks
          path: |
            .openbot-build/unlimited-capacity-e2e/report.json
            .openbot-build/unlimited-memory-storage-e2e/report.json
            .openbot-build/agent-webhook-routine-e2e/report.json
            .openbot-build/plan-continuation-e2e/report.json
            .openbot-build/remote-server-retry-e2e/report.json
            .openbot-build/agent-api-keys-e2e/report.json
            .openbot-build/vault-credential-discovery-e2e/report.json
            .openbot-build/webhook-card-reconnect-e2e/report.json
            .openbot-build/codex-deferred-mcp-e2e/report.json
            .openbot-build/codex-minimum-runtime-e2e/report.json
            .openbot-build/codex-mcp-session-recovery-e2e/report.json
            .openbot-build/codex-open-session-compaction-e2e/report.json
            .openbot-build/codex-held-tool-steer-e2e/report.json
            .openbot-build/browser-takeover-steer-e2e/report.json
            .openbot-build/steer-history-e2e/report.json
            .openbot-build/desktop-feed-e2e.json
            .openbot-build/browser-cdp-bridge/smoke.json
            .openbot-build/browser-secret/smoke.json
            .openbot-build/browser-user-control-e2e/report.json
          if-no-files-found: ignore

  linux:
    name: Build Linux x64 server
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb dbus gnome-keyring
      - name: Build server package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run dist:linux
      - name: Permit the packaged Electron sandbox
        shell: bash
        run: |
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
          sudo tee /etc/apparmor.d/openbot-desktop-verify >/dev/null <<PROFILE
          abi <abi/4.0>,
          include <tunables/global>
          profile openbot-desktop-verify "$GITHUB_WORKSPACE/dist/linux-unpacked/openbot" flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/openbot-desktop-verify
      - name: Verify package, launch, and immutable download addresses
        run: |
          xvfb-run -a bun run verify:package:linux dist/linux-unpacked --require-update-metadata
          bun scripts/prepare-desktop-update-manifest.ts dist/latest-linux.yml
          bun run verify:update-artifacts linux
      - name: Check thread cards, live plans, and steering through the packaged app
        run: xvfb-run -a bun scripts/side-thread-action-cards-e2e.ts dist/linux-unpacked/openbot
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-side-thread-card-checks
          path: .openbot-build/side-thread-action-cards-e2e/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-x64
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS ARM64 client for manual installation
    needs: check
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Require Apple silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build local-install client
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run dist:mac --publish never
      - name: Verify archive integrity, fuses, runtimes, and launch
        run: |
          bun run verify:package
          bun scripts/prepare-desktop-update-manifest.ts dist/latest-mac.yml
          bun run verify:update-artifacts macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish isolated desktop release
    needs: [check, linux, macos]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-linux-x64
          path: release-assets/linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-macos-arm64
          path: release-assets/macos
      - name: Check feed promotion and record release checksums
        run: |
          bun scripts/check-desktop-feed-promotion.ts release-assets/linux/latest-linux.yml
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum | \
            sed -E 's#  release-assets/(linux|macos)/#  #' > SHA256SUMS-desktop.txt
      - name: Publish immutable payloads, then advance only the desktop feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS-desktop.txt --dir existing
            cmp SHA256SUMS-desktop.txt existing/SHA256SUMS-desktop.txt
          else
            cat > release-notes.txt <<'NOTES'
          Build of the desktop branch. The repository's default branch is a different application.
          Linux x64 is a self-hosted server release. The macOS ARM64 client is for manual installation.
          The macOS client is not notarized and is not offered as an automatic update.
          NOTES
            gh release create "$tag" release-assets/linux/* release-assets/macos/* SHA256SUMS-desktop.txt \
              --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false --title "Desktop $tag" --notes-file release-notes.txt
          fi
          if ! gh release view desktop-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create desktop-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Desktop update feed" --notes "Moving Linux feed for the desktop branch. Payloads are in immutable desktop-v releases."
          fi
          bun scripts/check-desktop-feed-promotion.ts release-assets/linux/latest-linux.yml
          gh release upload desktop-latest release-assets/linux/latest-linux.yml --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit desktop-latest --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
